name: Build

on:
  push:
    #branches: [ $default-branch ]
    tags:
    - 'v*' # Push events to matching v*, i.e. v1.0, v20.15.10
  workflow_dispatch: # Allows to run this workflow manually from the Actions tab

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    strategy:
      matrix:
        architecture: [x64]
    name: Build on Windows ${{ matrix.architecture }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Fetch all history and tags

      - name: Get Git Version
        id: git_version
        if: github.event_name == 'workflow_dispatch'
        run: |
          $VERSION = $(git describe --tags --long)
          echo "VERSION=$VERSION" >> $GITHUB_ENV  # Set VERSION in $GITHUB_ENV for subsequent steps
          echo "Git version: $VERSION"  # Optional: Debugging output


      - name: Set up Python
        id: set_up_python
        uses: actions/setup-python@v5
        with:
          python-version: '3.8'
          architecture: ${{ matrix.architecture }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install --upgrade wheel # fix playsound installing
          pip install -r requirements_win.txt

      - name: Build
        run: |
          echo "VERSION=${{ env.VERSION }}"
          python builder.py build
        env:
          VERSION: ${{ env.VERSION }}

      - name: Generate installer
        run: |
          python builder.py bdist_msi

      - name: Upload the artifact
        uses: actions/upload-artifact@v4
        with:
          path: dist/*.msi
          name: ${{ runner.os }}-${{ matrix.architecture }}

      - name: Generate Changelog
        # Only on push
        if: startsWith(github.event_name, 'push') && startsWith(github.ref, 'refs/tags/')
        shell: python
        env:
          VERSION: ${{ github.ref_name }}
        run: |
          import os
          import re
          import sys
          from pathlib import Path

          sys.stdout.reconfigure(encoding="utf-8")

          version = os.environ["VERSION"]
          output = Path(r"${{ github.workspace }}-CHANGELOG.txt")

          def extract_changelog(filename):
              text = Path(filename).read_text(encoding="utf-8")
              text = text.replace("\r\n", "\n")

              # Find the section starting with ## ... VERSION
              pattern = rf"^##[ \t]+.*{re.escape(version)}.*\n([\s\S]*?)(?=^##[ \t]+|\Z)"
              match = re.search(pattern, text, re.MULTILINE)

              if not match:
                  raise RuntimeError(
                      f"Could not find changelog section for {version} in {filename}"
                  )

              return match.group(1).strip()

          ru = extract_changelog("changelog.ru.md")
          en = extract_changelog("changelog.en.md")

          output.write_text(
              ru + "\n\n---\n\n" + en + "\n",
              encoding="utf-8"
          )

          print(f"Generated changelog: {output}")
          print("----- CHANGELOG -----")
          print(output.read_text(encoding="utf-8"))
          print("---------------------")

      - name: Release
        # Only on push
        if: startsWith(github.event_name, 'push') && startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          body_path: ${{ github.workspace }}-CHANGELOG.txt
          files: |
            dist/*.msi
          generate_release_notes: true


